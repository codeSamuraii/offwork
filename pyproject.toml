[project]
name = "pyfuse"
version = "0.3.0"
description = "Distributed Python task execution via automatic function serialization"
readme = "README.md"
authors = [
    {name = "Rémi Héneault", email = "remi@heneault.fr"}
]
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.13"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
keywords = ["distributed", "remote-execution", "serialization", "task-queue"]

[project.urls]
Repository = "https://github.com/codeSamuraii/pyfuse"

[project.scripts]
pyfuse = "pyfuse.__main__:main"

[project.optional-dependencies]
redis = ["redis>=5.0"]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "ipython (>=9.11.0,<10.0.0)",
    "isort (>=8.0.1,<9.0.0)",
]

[tool.mypy]
strict = true

[tool.isort]
profile = "black"
length_sort = true
order_by_type = true
line_length = 180

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
